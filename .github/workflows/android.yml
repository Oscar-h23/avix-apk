name: Android AVIX CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Temporary debug signing key
        run: |
          keytool -genkeypair -noprompt -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Kotlin tests and debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
